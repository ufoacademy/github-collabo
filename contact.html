<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
  </head>
  <body>
    <table width="100%" height="100%" cellpadding="20" cellspacing="0" border="0">
      <tr>
        <td align="center" valign="middle">
          <table width="700" cellpadding="20" cellspacing="0" border="1" bordercolor="#cccccc">
            <tr>
              <td bgcolor="#f5f5f5">
                <h1>Contact Us</h1>
                <p>문의사항이 있으시면 아래 양식을 작성해 주세요.</p>
              </td>
            </tr>
            <tr>
              <td>
                <form action="#" method="post">
                  <table width="100%" cellpadding="8" cellspacing="0" border="0">
                    <tr>
                      <td width="120"><strong>이름</strong></td>
                      <td><input type="text" name="name" size="40" /></td>
                    </tr>
                    <tr>
                      <td><strong>이메일</strong></td>
                      <td><input type="email" name="email" size="40" /></td>
                    </tr>
                    <tr>
                      <td><strong>연락처</strong></td>
                      <td><input type="tel" name="phone" size="40" /></td>
                    </tr>
                    <tr>
                      <td valign="top"><strong>문의 내용</strong></td>
                      <td><textarea name="message" rows="8" cols="50"></textarea></td>
                    </tr>
                    <tr>
                      <td></td>
                      <td>
                        <input type="submit" value="보내기" />
                        <input type="reset" value="초기화" />
                      </td>
                    </tr>
                  </table>
                </form>
              </td>
            </tr>
            <tr>
              <td bgcolor="#f5f5f5">
                <p><strong>회사 정보</strong></p>
                <p>주소: 서울특별시 서초구 고속터미널 </p>
                <p>전화: 02-123-4567</p>
                <p>이메일: hello@example.com</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
